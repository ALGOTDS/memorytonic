name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  python:
    name: Python — syntax + import check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Syntax-check every .py file
        run: |
          python -m compileall -q components/01-ingestion getting\ youtube\ srts
      - name: Lint with ruff (warnings only — does not fail the build)
        run: |
          pip install ruff
          ruff check components/01-ingestion getting\ youtube\ srts --exit-zero

  graph-studio:
    name: 02-graph-studio — type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/02-graph-studio
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/02-graph-studio/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit

  frontend:
    name: 03-frontend — type check
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: components/03-frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: components/03-frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
